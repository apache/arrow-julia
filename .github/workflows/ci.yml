name: CI
on:
  pull_request:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    tags:
      - '**'
jobs:
  license:
    name: Audit licenses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Run Release audit tool (Rat)
        run: dev/release/run_rat.sh .
  release:
    name: Verify release - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install julia subversion
      - name: Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y -V subversion
      - name: Create
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_DEFAULT=0 dev/release/release_rc.sh 100
      - uses: actions/cache@v6
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-release-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-release-
      - name: Verify
        run: |
          version=$(grep -o '^version = ".*"' "Project.toml" | \
                      sed -e 's/^version = "//g' \
                          -e 's/"$//g')
          VERIFY_DEFAULT=0 dev/release/verify_rc.sh ${version} 100
  test:
    name: ${{ matrix.pkg.name }} - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.nthreads }} threads - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - name: Arrow.jl
            dir: '.'
          - name: ArrowTypes.jl
            dir: './src/ArrowTypes'
          - name: ArrowStrings.jl
            dir: './src/ArrowStrings'
        version:
          - 'min'
          - '1.11'
          - '1' # automatically expands to the latest stable 1.x release of Julia
          - 'pre' # expands to latest alpha, beta or RC, if available, otherwise same as `1`
        os:
          - ubuntu-latest
          - macos-latest
        nthreads:
          - 1
          - 2
        exclude:
          # ArrowTypes supports Julia 1.0, but Julia 1.0 has no Apple Silicon
          # macOS binary. Keep its minimum-version coverage on Ubuntu.
          - pkg:
              name: ArrowTypes.jl
              dir: './src/ArrowTypes'
            version: 'min'
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          project: ${{ matrix.pkg.dir }}
      - uses: actions/cache@v6
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      # Before the build: ArrowStrings is unregistered, ArrowTypes 2.4 is in
      # this monorepo, and Tables.Scan is
      # unreleased; Julia 1.10's Pkg does not read the `[sources]` entries
      # that point at them, so the resolve would fail without this step.
      - name: Dev local subpackages and the Tables scan branch for Arrow.jl tests
        if: matrix.pkg.name == 'Arrow.jl'
        shell: julia --project=. {0}
        run: |
          using Pkg
          Pkg.develop([PackageSpec(path="src/ArrowStrings"), PackageSpec(path="src/ArrowTypes")])
          Pkg.add(PackageSpec(url="https://github.com/JuliaData/Tables.jl", rev="64268c6a316e380cc3da26965f440a5433ebc1f7"))
      - uses: julia-actions/julia-buildpkg@v1.6
        with:
          project: ${{ matrix.pkg.dir }}
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.nthreads }}
        with:
          project: ${{ matrix.pkg.dir }}
      - name: Process Arrow.jl coverage
        if: matrix.pkg.name == 'Arrow.jl'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - name: Process subpackage coverage
        if: matrix.pkg.name != 'Arrow.jl'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: ${{ matrix.pkg.dir }}/src
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
  test_monorepo:
    name: Monorepo dev - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        version:
          - '1' # automatically expands to the latest stable 1.x release of Julia
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v6
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - name: Dev monorepo dependencies
        shell: julia --project=monorepo {0}
        run: |
          using Pkg;
          Pkg.develop([PackageSpec(path="."), PackageSpec(path="src/ArrowTypes"), PackageSpec(path="src/ArrowStrings")])
          Pkg.add(PackageSpec(url="https://github.com/JuliaData/Tables.jl", rev="64268c6a316e380cc3da26965f440a5433ebc1f7"))
      - name: Run monorepo tests
        continue-on-error: false
        run: >
          julia --color=yes --project=monorepo -e 'using Pkg; Pkg.test("Arrow")'
  test_windows:
    name: ${{ matrix.pkg.name }} - Julia latest - Windows - 2 threads
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - name: Arrow.jl
            dir: '.'
          - name: ArrowTypes.jl
            dir: './src/ArrowTypes'
          - name: ArrowStrings.jl
            dir: './src/ArrowStrings'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          project: ${{ matrix.pkg.dir }}
      - uses: actions/cache@v6
        with:
          path: ~/.julia/artifacts
          key: windows-test-${{ hashFiles('**/Project.toml') }}
          restore-keys: windows-test-
      - name: Prepare Arrow.jl development dependencies
        if: matrix.pkg.name == 'Arrow.jl'
        shell: julia --project=. {0}
        run: |
          using Pkg
          Pkg.develop([PackageSpec(path="src/ArrowStrings"), PackageSpec(path="src/ArrowTypes")])
          Pkg.add(PackageSpec(url="https://github.com/JuliaData/Tables.jl", rev="64268c6a316e380cc3da26965f440a5433ebc1f7"))
      - uses: julia-actions/julia-buildpkg@v1.6
        with:
          project: ${{ matrix.pkg.dir }}
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 2
        with:
          project: ${{ matrix.pkg.dir }}
  trim:
    name: ArrowCore JuliaC trim-safe compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.6'
      - uses: actions/cache@v6
        with:
          path: ~/.julia/artifacts
          key: trim-${{ runner.os }}-${{ hashFiles('test/trim/Project.toml') }}
          restore-keys: trim-${{ runner.os }}-
      - name: Compile and run the trim-safe ArrowCore workload
        run: julia --startup-file=no --history-file=no test/trim_compile_tests.jl
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Prepare Arrow.jl development dependencies for the docs
        shell: julia --project=docs {0}
        run: |
          using Pkg
          Pkg.develop([PackageSpec(path="."), PackageSpec(path="src/ArrowStrings"), PackageSpec(path="src/ArrowTypes")])
          Pkg.add(PackageSpec(url="https://github.com/JuliaData/Tables.jl", rev="64268c6a316e380cc3da26965f440a5433ebc1f7"))
      - uses: julia-actions/julia-buildpkg@v1.7.0
      - uses: julia-actions/julia-docdeploy@v1.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
  Format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: julia-actions/setup-julia@v3
      - uses: actions/checkout@v7
      - name: Install JuliaFormatter and format
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="2.12.4"))'
          julia -e 'using JuliaFormatter; format(".", verbose=true)'
      - name: Format check
        run: |
          julia -e '
          out = Cmd(`git diff --name-only`) |> read |> String
          if out == ""
              exit(0)
          else
              @error "Some files have not been formatted !!!"
              write(stdout, out)
              exit(1)
          end'
