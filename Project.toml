name = "Arrow"
uuid = "69666777-d1a9-59fb-9406-91d4454c9d45"
authors = ["quinnj <quinn.jacobd@gmail.com>"]
version = "3.0.0-DEV"

[deps]
ArrowStrings = "c38d8858-22a2-449e-9eca-ef92ec15f353"
ArrowTypes = "31f734f8-188a-4ce0-8406-c8a06bd891cd"
Base64 = "2a0f44e3-6c83-55bd-87e4-b1978d98bd5f"
CodecLz4 = "5ba52731-8f18-5e0d-9241-30f10d1ec561"
CodecZstd = "6b39b394-51ab-5f42-8807-6242bab2b4c2"
DataAPI = "9a962f9c-6df0-11e9-0e5d-c546b8b5ee8a"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
EnumX = "4e289a0a-7415-4d19-859d-a7e5c4648b56"
Mmap = "a63ad114-7e13-5084-954f-fe012c677804"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"
Tables = "bd369af6-aec1-5ad0-b16a-f7cc5008161c"
TranscodingStreams = "3bb67fe8-82b1-5028-8e26-92a6c54297fa"

# ArrowStrings and ArrowTypes live in this repository and are released and
# registered independently; the source entries resolve their subdirectories.
# Pkg reads `[sources]` from Julia 1.11; on 1.10 the CI workflow devs both explicitly.
[sources]
ArrowStrings = {path = "src/ArrowStrings"}
ArrowTypes = {path = "src/ArrowTypes"}

[weakdeps]
CloudStore = "3365d9ee-d53b-4a56-812d-5344d5b716d7"
TimeZones = "f269a46b-ccf7-5d73-abea-4c690281aa53"

[extensions]
ArrowCloudStoreExt = "CloudStore"
ArrowTimeZonesExt = "TimeZones"

[compat]
ArrowStrings = "1"
ArrowTypes = "2"
Base64 = "1.10"
CloudStore = "1.6"
CodecLz4 = "0.4"
DataAPI = "1"
Dates = "1.10"
CodecZstd = "0.8"
EnumX = "1"
Mmap = "1.10"
PrecompileTools = "1"
Tables = "1.14"
TimeZones = "1"
TranscodingStreams = "0.9.12, 0.10, 0.11"
julia = "1.10"
