# The HOST side of the conformance driver: only what conformance/run.jl
# needs to build the image and drive the container. run.jl activates and
# instantiates this environment itself. (conformance/Project.toml is the
# in-container suite environment.)
[deps]
Harbor = "af79dbb9-1a80-47ad-8928-192a4af69376"

[compat]
Harbor = "1.1"
julia = "1.10"
